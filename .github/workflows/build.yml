name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn -B package

  deploy:
    needs: build
    # Same rules as the former Bitbucket Pipelines: master and release-* publish to Artifactory
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF_NAME}" == release-* ]]; then
            echo "BUILD_VERSION=${GITHUB_REF_NAME}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=${GITHUB_REF_NAME}.${GITHUB_RUN_NUMBER}-SNAPSHOT" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        run: mvn -B -s settings.xml deploy -Dbuild.version="$BUILD_VERSION"
