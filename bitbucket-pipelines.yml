# This is a sample build configuration for Java (Maven).
# Check our guides at https://confluence.atlassian.com/x/zd-5Mw for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: maven:3.3.9

pipelines:
  default:
    - step:
        caches:
          - maven
        script:
          - mvn package
  branches:
    master:
      - step:
          caches:
            - maven
          script:
            - mvn -s settings.xml deploy -Dbuild.version=$BITBUCKET_BRANCH.$BITBUCKET_BUILD_NUMBER-SNAPSHOT
    release-*:
      - step:
          caches:
            - maven
          script:
            - mvn -s settings.xml deploy -Dbuild.version=$BITBUCKET_BRANCH.$BITBUCKET_BUILD_NUMBER